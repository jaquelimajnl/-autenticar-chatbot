<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutentiCar – Painel do analista</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#14202b;--mut:#5d6b78;--pri:#0b6e4f;--prit:#fff;--bd:#d9e0e6;--ok:#0b6e4f;--warn:#b26a00;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222a;--tx:#e8eef2;--mut:#9aa9b6;--pri:#3fbf8f;--prit:#06231a;--bd:#2a3944;--ok:#3fbf8f;--warn:#e0a040;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
header b{font-size:17px}header small{color:var(--mut);display:block;font-size:12px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--pri);color:var(--prit);display:grid;place-items:center;font-weight:700}
main{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:12px;padding:12px;max-width:1100px;margin:0 auto}
@media (max-width:760px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
h2{font-size:15px;margin:0 0 8px}
input,textarea,button{font:inherit}
input,textarea{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
button{border:0;border-radius:10px;padding:9px 14px;background:var(--pri);color:var(--prit);font-weight:600;cursor:pointer}
button.bad{background:var(--bad);color:#fff}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.case{padding:10px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;cursor:pointer}
.case.sel{border-color:var(--pri)}
.case small{color:var(--mut);display:block}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid currentColor;margin:2px 4px 2px 0}
.pendente{color:var(--warn)}.aprovado{color:var(--ok)}.reprovado{color:var(--bad)}
.item{border-top:1px solid var(--bd);padding-top:10px;margin-top:10px}
.item img{max-width:100%;max-height:340px;border-radius:8px;display:block;margin:6px 0}
.al{color:var(--bad)}.wr{color:var(--warn)}
#err{color:var(--bad);margin-top:6px}
.hide{display:none}
</style>
</head>
<body>
<header><div class="logo">AC</div><div><b>AutentiCar</b><small>Painel do analista – revisão humana</small></div></header>
<main>
  <section class="card" id="login">
    <h2>Entrar</h2>
    <input type="password" id="pw" placeholder="Senha do analista" autocomplete="current-password">
    <div class="row"><button id="enter">Entrar</button></div>
    <div id="err"></div>
  </section>
  <section class="card hide" id="listbox"><h2>Casos</h2><div id="list"></div></section>
  <section class="card hide" id="detail"><h2>Selecione um caso</h2></section>
</main>
<script>
const $=id=>document.getElementById(id);
let key=sessionStorage.getItem("k")||"",cur=null,timer=null;
const fmt=t=>new Date(t).toLocaleString("pt-BR");
async function api(p,opt={}){const r=await fetch(p,{...opt,headers:{"Content-Type":"application/json","x-analyst-key":key}});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||"erro"),{status:r.status});return j}
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
async function loadList(){
  try{
    const l=await api("/api/analyst/cases");
    $("login").classList.add("hide");$("listbox").classList.remove("hide");$("detail").classList.remove("hide");
    const box=$("list");box.innerHTML="";
    if(!l.length)box.appendChild(el("small","","Nenhum caso até agora. A lista atualiza sozinha."));
    l.forEach(c=>{const d=el("div","case"+(c.id===cur?" sel":""));d.appendChild(el("b","",c.plate||"Sem placa"));d.appendChild(el("span","tag "+c.status,c.status));d.appendChild(el("small","",fmt(c.createdAt)+" · "+c.alerts+" alerta(s) · protocolo "+c.id.slice(0,8).toUpperCase()));d.onclick=()=>open(c.id);box.appendChild(d)});
    if(!timer)timer=setInterval(loadList,5000);
  }catch(e){
    if(e.status===401||e.status===503){sessionStorage.removeItem("k");key="";clearInterval(timer);timer=null;$("login").classList.remove("hide");$("listbox").classList.add("hide");$("detail").classList.add("hide");$("err").textContent=e.message}
  }
}
async function open(id){
  cur=id;const c=await api("/api/analyst/cases/"+id);const d=$("detail");d.innerHTML="";
  d.appendChild(el("h2","","Caso "+c.id.slice(0,8).toUpperCase()+" – placa "+(c.plate||"não informada")));
  d.appendChild(el("span","tag "+c.status,c.status));d.appendChild(el("small","",fmt(c.createdAt)));
  c.items.forEach(it=>{const b=el("div","item");b.appendChild(el("b","",it.view));
    if(it.image){const i=new Image();i.src=it.image;b.appendChild(i)}
    it.alerts.forEach(a=>b.appendChild(el("div","al","⚠ "+a)));
    it.warns.forEach(a=>b.appendChild(el("div","wr","• "+a)));
    if(it.obs)b.appendChild(el("div","",it.obs));d.appendChild(b)});
  const f=el("div","item");
  if(c.status==="pendente"){
    f.appendChild(el("b","","Decisão do analista"));
    const n=el("textarea");n.rows=3;n.placeholder="Observação (opcional)";n.style.marginTop="6px";f.appendChild(n);
    const r=el("div","row");
    const ok=el("button","","Aprovar");ok.onclick=()=>decide(id,"aprovado",n.value);
    const no=el("button","bad","Reprovar");no.onclick=()=>decide(id,"reprovado",n.value);
    r.appendChild(ok);r.appendChild(no);f.appendChild(r);
  }else{f.appendChild(el("b","","Decisão registrada: "+c.status));if(c.decision&&c.decision.note)f.appendChild(el("div","",c.decision.note))}
  d.appendChild(f);loadList();
}
async function decide(id,decision,note){
  try{await api("/api/analyst/cases/"+id+"/decision",{method:"POST",body:JSON.stringify({decision,note})});await open(id)}
  catch(e){alert(e.message)}
}
$("enter").onclick=()=>{key=$("pw").value;sessionStorage.setItem("k",key);$("err").textContent="";loadList()};
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("enter").click()});
if(key)loadList();
</script>
</body>
</html>
